<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>용어사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF5; --grid:#E4E7DD; --paper:#FFFFFF; --ink:#23262B;
    --sub:#6C7268; --up:#D6455A; --down:#2E6B8A; --mustard:#E3A73F;
  }
  *{box-sizing:border-box;}
  html{ color-scheme: light; }
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 32px);
    color:var(--ink); font-family:'Gowun Dodum', sans-serif; line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:660px; margin:0 auto; padding:44px 22px 90px; }
  h1{ font-family:'Gaegu', sans-serif; font-weight:700; color:var(--ink); margin:0; }
  .breadcrumb{ font-size:0.85rem; color:var(--sub); margin-bottom:18px; }
  .breadcrumb a{ color:var(--sub); }
  .hero{ text-align:left; padding-bottom:28px; margin-bottom:30px; border-bottom:3px solid var(--ink); }
  .hero h1{ font-size:2.2rem; line-height:1.3; }
  .hero .accent{ color:var(--up); }
  .hero p{ font-size:1.05rem; color:var(--sub); margin-top:14px; max-width:520px; }
  .searchbox{
    width:100%; border:2px solid var(--ink); border-radius:10px; padding:12px 14px;
    font-size:1rem; font-family:inherit; margin-bottom:26px; background:#fff;
    box-shadow:4px 4px 0 var(--ink);
  }
  .term{
    background:var(--paper); border:2px solid var(--ink); border-radius:12px;
    padding:14px 18px; margin:12px 0; box-shadow:4px 4px 0 var(--ink);
  }
  .term dt{ font-family:'Gaegu',sans-serif; font-size:1.15rem; color:var(--up); margin:0; }
  .term dd{ margin:6px 0 0; font-size:0.95rem; color:var(--ink); }
  .term.hide{ display:none; }
  .empty{ text-align:center; color:var(--sub); padding:30px 0; display:none; }
  .navrow{ display:flex; justify-content:space-between; gap:12px; margin-top:56px; font-size:0.92rem; flex-wrap:wrap; }
  .navrow a{
    color:var(--ink); text-decoration:none; border:2px solid var(--ink); border-radius:10px;
    padding:10px 16px; box-shadow:3px 3px 0 var(--ink); background:#fff;
  }
  footer{ margin-top:56px; padding-top:20px; border-top:3px solid var(--ink); font-size:0.88rem; color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">

  <div class="breadcrumb"><a href="./index.html">📚 주식 공부 아카이브</a> / 부록</div>

  <div class="hero">
    <h1>용어<br><span class="accent">사전</span> 🔎📖</h1>
    <p>헷갈리는 용어가 나오면 여기서 검색해서 찾아봐.</p>
  </div>

  <input type="text" class="searchbox" id="search" placeholder="용어를 검색해봐 (예: PER, 호가창, 손절)">

  <dl id="terms"></dl>
  <div class="empty" id="empty">검색 결과가 없어. 다른 단어로 찾아봐.</div>

  <div class="navrow">
    <a href="./investor-psychology.html">← 7장. 투자 심리 함정</a>
    <a href="./index.html">목차로</a>
  </div>

  <footer>
    용어 설명은 쉽게 이해하도록 단순화한 버전이야. 더 정확한 정의가 궁금하면 각 챕터 본문을 참고해줘 🙏
  </footer>

</div>

<script>
const terms = [
  {t:'주식', d:'회사를 잘게 쪼갠 소유권 한 조각. 주식을 사면 그 회사의 부분적인 주인이 돼.'},
  {t:'시가총액', d:'주가 × 발행주식수. 회사 전체를 통째로 사려면 필요한 금액.'},
  {t:'상장(IPO)', d:'회사가 처음으로 주식을 발행해서 투자자에게 파는 것.'},
  {t:'발행시장', d:'회사가 투자자에게 직접 새 주식을 파는 시장.'},
  {t:'유통시장', d:'이미 발행된 주식을 투자자끼리 사고파는 거래소 시장.'},
  {t:'캔들(봉)', d:'일정 기간(하루 등)의 시가·종가·고가·저가를 한 막대로 표현한 것.'},
  {t:'시가', d:'그 기간이 시작될 때의 가격.'},
  {t:'종가', d:'그 기간이 끝날 때의 가격.'},
  {t:'고가', d:'그 기간 중 가장 높았던 가격.'},
  {t:'저가', d:'그 기간 중 가장 낮았던 가격.'},
  {t:'양봉', d:'종가가 시가보다 높은 봉 (보통 빨간색으로 표시).'},
  {t:'음봉', d:'종가가 시가보다 낮은 봉 (보통 파란색으로 표시).'},
  {t:'이동평균선(이평선)', d:'최근 N일 동안의 평균 가격을 이어 그린 선. 흐름을 부드럽게 보여줌.'},
  {t:'골든크로스', d:'단기 이평선이 장기 이평선을 아래에서 위로 뚫고 올라가는 것. 상승 신호로 해석.'},
  {t:'데드크로스', d:'단기 이평선이 장기 이평선을 위에서 아래로 뚫고 내려가는 것. 하락 신호로 해석.'},
  {t:'거래량', d:'일정 기간 동안 사고팔린 주식의 수량. 관심도와 신뢰도를 가늠하는 지표.'},
  {t:'지지선', d:'가격이 떨어지다가 자주 멈추고 반등하는 가격대 (바닥 역할).'},
  {t:'저항선', d:'가격이 오르다가 자주 멈추고 밀리는 가격대 (천장 역할).'},
  {t:'RSI', d:'0~100 사이 값으로 과매수·과매도를 가늠하는 지표. 70 이상 과매수, 30 이하 과매도로 해석.'},
  {t:'시장가 주문', d:'가격을 지정하지 않고 지금 나와있는 가격에 즉시 사거나 파는 주문.'},
  {t:'지정가 주문', d:'원하는 가격을 정해두고 그 가격에 도달하면 체결되는 주문.'},
  {t:'호가창(오더북)', d:'현재 쌓여있는 매수·매도 지정가 주문들을 가격별로 보여주는 표.'},
  {t:'스프레드', d:'최우선 매도호가와 최우선 매수호가의 가격 차이. 좁을수록 유동성이 좋음.'},
  {t:'손익계산서', d:'일정 기간 동안 얼마 벌고 얼마 썼는지를 보여주는 재무제표.'},
  {t:'재무상태표', d:'특정 시점에 회사가 가진 자산과 빚의 스냅샷을 보여주는 재무제표.'},
  {t:'현금흐름표', d:'장부상 이익이 아니라 실제 현금이 들어오고 나간 흐름을 보여주는 재무제표.'},
  {t:'매출', d:'회사가 물건이나 서비스를 팔아서 벌어들인 돈 전체.'},
  {t:'영업이익', d:'매출에서 원가와 운영비(인건비, 마케팅비 등)까지 뺀 이익. 본업 실력을 보여줌.'},
  {t:'순이익', d:'영업이익에서 세금, 이자 등까지 뺀 최종적으로 남는 이익.'},
  {t:'PER', d:'주가 ÷ EPS(1주당순이익). 낮을수록 이익 대비 저평가일 가능성.'},
  {t:'PBR', d:'주가 ÷ BPS(1주당순자산). 1보다 낮으면 장부가보다 싸게 거래되는 것.'},
  {t:'ROE', d:'순이익 ÷ 자기자본. 회사가 자기 돈을 얼마나 효율적으로 굴리는지 보여줌.'},
  {t:'분산투자', d:'여러 종목·자산에 나눠 담아서 한 곳의 위험이 전체에 미치는 영향을 줄이는 전략.'},
  {t:'손절매(로스컷)', d:'예측이 틀렸을 때를 대비해 미리 정해둔 가격에 도달하면 손실을 확정짓고 파는 것.'},
  {t:'포지션 사이징', d:'이번 거래에서 허용할 최대 손실 금액을 먼저 정하고, 그에 맞춰 매수 수량을 정하는 것.'},
  {t:'복리', d:'원금뿐 아니라 이미 붙은 이자에도 다시 이자가 붙는 방식. 시간이 갈수록 증가 속도가 빨라짐.'},
  {t:'단리', d:'매번 원금에 대해서만 이자가 붙는 방식. 복리보다 느리게 증가.'},
  {t:'72의 법칙', d:'72 ÷ 연 수익률(%) ≈ 원금이 두 배가 되는 데 걸리는 대략적인 기간(년).'},
  {t:'손실회피', d:'같은 크기라도 이익의 기쁨보다 손실의 고통을 더 크게 느끼는 심리적 편향.'},
  {t:'FOMO', d:'놓칠까봐 불안해서 이미 많이 오른 자산을 충동적으로 따라 사는 심리.'},
  {t:'확증편향', d:'내 판단을 지지하는 정보만 눈에 들어오고 반대되는 정보는 무시하게 되는 편향.'},
  {t:'매몰비용 오류', d:'이미 써버린 돈에 집착해서 앞으로의 전망과 무관하게 잘못된 결정을 이어가는 것.'},
];

const dl = document.getElementById('terms');
terms.sort((a,b)=> a.t.localeCompare(b.t, 'ko'));
terms.forEach(item=>{
  const div = document.createElement('div');
  div.className = 'term';
  div.dataset.key = (item.t + ' ' + item.d).toLowerCase();
  div.innerHTML = `<dt>${item.t}</dt><dd>${item.d}</dd>`;
  dl.appendChild(div);
});

document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.term').forEach(el=>{
    const match = el.dataset.key.includes(q);
    el.classList.toggle('hide', !match);
    if(match) visible++;
  });
  document.getElementById('empty').style.display = visible === 0 ? 'block' : 'none';
});
</script>
</body>
</html>
